<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Vender por menos de lo que queda en libros</title><desc id="desc">Valor pendiente 1,2 millones, precio 1 millón, pérdida 200.000 euros y ahorro fiscal 50.000 euros.</desc><rect width="1000" height="500" rx="16" fill="#f2f6f4"/><g font-family="Arial, sans-serif" fill="#183d36"><text x="40" y="48" font-size="27" font-weight="700">Vender por menos de lo que queda en libros</text><text x="40" y="86" font-size="19" fill="#183d36">El valor que queda en libros no es el dinero que recibimos al vender.</text><rect x="40" y="120" width="270" height="155" rx="12" fill="white" stroke="#adc7b9"/><text x="57" y="155" font-size="20" fill="#183d36">Valor pendiente</text><text x="57" y="204" font-size="28" fill="#183d36">1.200.000 €</text><text x="57" y="246" font-size="16" fill="#183d36">12 M€ − 5 × 2,16 M€</text><rect x="365" y="120" width="270" height="155" rx="12" fill="white" stroke="#adc7b9"/><text x="382" y="155" font-size="20" fill="#183d36">Precio de venta</text><text x="382" y="204" font-size="28" fill="#183d36">1.000.000 €</text><text x="382" y="246" font-size="16" fill="#183d36">Cobro real al final del año 5</text><rect x="690" y="120" width="270" height="155" rx="12" fill="white" stroke="#adc7b9"/><text x="707" y="155" font-size="20" fill="#183d36">Resultado de la venta</text><text x="707" y="204" font-size="28" fill="#183d36">−200.000 €</text><text x="707" y="246" font-size="16" fill="#183d36">Pérdida, no pago adicional</text><text x="45" y="325" font-size="20" fill="#183d36">La pérdida reduce la base imponible: 200.000 × 25 % = 50.000 € menos de impuesto.</text><rect x="40" y="357" width="920" height="95" rx="12" fill="#183d36"/><text x="65" y="397" font-size="25" fill="#ffffff">Efecto total de la salida en caja: 1.000.000 + 50.000 = 1.050.000 €</text><text x="65" y="431" font-size="18" fill="#ffffff">Este ahorro se aplica aquí contra el resultado positivo del propio año.</text></g></svg>
