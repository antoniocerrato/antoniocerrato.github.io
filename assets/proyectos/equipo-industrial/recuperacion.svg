<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">Recuperar euros no es lo mismo que recuperar valor</title><desc id="desc">Sin descuento se recupera en el cuarto año; al 10 por ciento, en el quinto.</desc><rect width="1000" height="700" rx="16" fill="#f2f6f4"/><g font-family="Arial, sans-serif" fill="#183d36"><text x="40" y="48" font-size="27" font-weight="700">Recuperar euros no es lo mismo que recuperar valor</text><text x="40" y="84" font-size="19" fill="#183d36">Saldo acumulado después de recuperar, o no, los 12 millones iniciales.</text><path d="M100 594H930" stroke="#d3dfd8" stroke-width="1"/><text x="42" y="600" font-size="16" fill="#183d36">-12 M€</text><path d="M100 492H930" stroke="#d3dfd8" stroke-width="1"/><text x="42" y="498" font-size="16" fill="#183d36">-6 M€</text><path d="M100 390H930" stroke="#738e84" stroke-width="2"/><text x="42" y="396" font-size="16" fill="#183d36">0 M€</text><path d="M100 288H930" stroke="#d3dfd8" stroke-width="1"/><text x="42" y="294" font-size="16" fill="#183d36">6 M€</text><polyline points="110,594 270,546.57 430,489.297 590,420.4982652 750,345.70230555599994 910,246.6105994321199" fill="none" stroke="#ad673b" stroke-width="4"/><circle cx="110" cy="594" r="6" fill="#ad673b"/><circle cx="270" cy="546.57" r="6" fill="#ad673b"/><circle cx="430" cy="489.297" r="6" fill="#ad673b"/><circle cx="590" cy="420.4982652" r="6" fill="#ad673b"/><circle cx="750" cy="345.70230555599994" r="6" fill="#ad673b"/><circle cx="910" cy="246.6105994321199" r="6" fill="#ad673b"/><polyline points="110,594 270,550.8818181818182 430,503.5487603305785 590,451.85925259203606 750,400.77260574824123 910,339.24445247761264" fill="none" stroke="#236c60" stroke-width="4"/><circle cx="110" cy="594" r="6" fill="#236c60"/><circle cx="270" cy="550.8818181818182" r="6" fill="#236c60"/><circle cx="430" cy="503.5487603305785" r="6" fill="#236c60"/><circle cx="590" cy="451.85925259203606" r="6" fill="#236c60"/><circle cx="750" cy="400.77260574824123" r="6" fill="#236c60"/><circle cx="910" cy="339.24445247761264" r="6" fill="#236c60"/><text x="90" y="625" font-size="17" fill="#183d36">Año 0</text><text x="250" y="625" font-size="17" fill="#183d36">Año 1</text><text x="410" y="625" font-size="17" fill="#183d36">Año 2</text><text x="570" y="625" font-size="17" fill="#183d36">Año 3</text><text x="730" y="625" font-size="17" fill="#183d36">Año 4</text><text x="890" y="625" font-size="17" fill="#183d36">Año 5</text><text x="500" y="140" font-size="20" fill="#ad673b">Sin descuento: +8,435 M€ al final</text><text x="500" y="176" font-size="20" fill="#236c60">Al 10 %: +2,986 M€ al final (VAN)</text><text x="40" y="668" font-size="18" fill="#183d36">Las líneas unen cierres anuales; no representan un calendario mensual de cobros.</text></g></svg>
