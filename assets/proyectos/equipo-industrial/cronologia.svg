<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Cuándo sale y cuándo vuelve el dinero</title><desc id="desc">Flujo inicial de menos 12 millones y flujos de 2,790; 3,369; 4,047; 4,400 y 5,829 millones.</desc><rect width="1000" height="500" rx="16" fill="#f2f6f4"/><g font-family="Arial, sans-serif" fill="#183d36"><text x="40" y="48" font-size="27" font-weight="700">Cuándo sale y cuándo vuelve el dinero</text><text x="40" y="83" font-size="19" fill="#183d36">Doce millones hoy; cinco años de cobros netos después de impuestos.</text><path d="M85 260H920" stroke="#8ca69b" stroke-width="4"/><circle cx="95" cy="260" r="7" fill="#183d36"/><text x="73" y="292" font-size="17" fill="#183d36">Año 0</text><path d="M95 253V377" stroke="#a44837" stroke-width="5"/><path d="M87 365L95 377L103 365" fill="none" stroke="#a44837" stroke-width="4"/><text x="47" y="410" font-size="18" fill="#183d36">-12,000 M€</text><circle cx="254" cy="260" r="7" fill="#183d36"/><text x="232" y="292" font-size="17" fill="#183d36">Año 1</text><path d="M254 253V150" stroke="#2a7566" stroke-width="5"/><path d="M246 162L254 150L262 162" fill="none" stroke="#2a7566" stroke-width="4"/><text x="206" y="130" font-size="18" fill="#183d36">2,790 M€</text><circle cx="413" cy="260" r="7" fill="#183d36"/><text x="391" y="292" font-size="17" fill="#183d36">Año 2</text><path d="M413 253V150" stroke="#2a7566" stroke-width="5"/><path d="M405 162L413 150L421 162" fill="none" stroke="#2a7566" stroke-width="4"/><text x="365" y="130" font-size="18" fill="#183d36">3,369 M€</text><circle cx="572" cy="260" r="7" fill="#183d36"/><text x="550" y="292" font-size="17" fill="#183d36">Año 3</text><path d="M572 253V150" stroke="#2a7566" stroke-width="5"/><path d="M564 162L572 150L580 162" fill="none" stroke="#2a7566" stroke-width="4"/><text x="524" y="130" font-size="18" fill="#183d36">4,047 M€</text><circle cx="731" cy="260" r="7" fill="#183d36"/><text x="709" y="292" font-size="17" fill="#183d36">Año 4</text><path d="M731 253V150" stroke="#2a7566" stroke-width="5"/><path d="M723 162L731 150L739 162" fill="none" stroke="#2a7566" stroke-width="4"/><text x="683" y="130" font-size="18" fill="#183d36">4,400 M€</text><circle cx="890" cy="260" r="7" fill="#183d36"/><text x="868" y="292" font-size="17" fill="#183d36">Año 5</text><path d="M890 253V150" stroke="#2a7566" stroke-width="5"/><path d="M882 162L890 150L898 162" fill="none" stroke="#2a7566" stroke-width="4"/><text x="842" y="130" font-size="18" fill="#183d36">5,829 M€</text><text x="40" y="455" font-size="19" fill="#183d36">En el año 5: 4,779 M€ de explotación + 1 M€ de venta + 0,050 M€ de ahorro fiscal.</text></g></svg>
