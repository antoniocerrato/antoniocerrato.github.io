<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">Del margen de explotación al dinero disponible</title><desc id="desc">El EBITDA de 1.880.000 euros se reduce en 212.500 de impuesto y 902.466 de incremento del circulante, hasta 765.034 euros.</desc><rect width="1000" height="500" fill="#f7f7f1"/><style>text{font-family:Arial,sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.grid{stroke:#d9dfd9;stroke-width:1}</style><text x="36" y="45" class="title">Del margen de explotación al dinero disponible</text><text x="36" y="82" class="label">Año 1 · euros · sin deuda ni nuevas inversiones</text><text x="36" y="153" class="label">EBITDA</text><rect x="265" y="130" width="611" height="44" fill="#245765"/><text x="886" y="159" class="label">1.880.000</text><text x="36" y="249" class="label">− Impuesto</text><rect x="265" y="226" width="541.9375" height="44" fill="#245765"/><text x="816.9375" y="255" class="label">1.667.500</text><text x="36" y="345" class="label">− Aumento NOF</text><rect x="265" y="322" width="248.63613013698622" height="44" fill="#b46b42"/><text x="523.6361301369863" y="351" class="label">765.034</text><text x="36" y="447" class="label">La amortización (1.030.000 €) reduce el impuesto, pero no es un pago.</text></svg>
