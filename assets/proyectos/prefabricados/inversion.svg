<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">¿En qué se emplea el dinero?</title><desc id="desc">Desglose de los doce millones entre cinco grupos de activos y existencias iniciales adicionales.</desc><rect width="1000" height="500" fill="#f7f7f1"/><style>text{font-family:Arial,sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.grid{stroke:#d9dfd9;stroke-width:1}</style><text x="36" y="45" class="title">¿En qué se emplea el dinero?</text><text x="36" y="80" class="label">12,00 M€ de inversión fija + 0,385 M€ de existencias iniciales</text><rect x="36" y="116" width="61.86666666666667" height="95" fill="#b5a780"/><rect x="97.86666666666667" y="116" width="216.5333333333333" height="95" fill="#648f88"/><rect x="314.4" y="116" width="587.7333333333333" height="95" fill="#245765"/><rect x="902.1333333333333" y="116" width="46.4" height="95" fill="#b46b42"/><rect x="948.5333333333333" y="116" width="15.466666666666667" height="95" fill="#7d7398"/><rect x="40" y="241" width="22" height="22" fill="#b5a780"/><text x="78" y="258" class="label">Terreno: 0,80 M€</text><rect x="40" y="279" width="22" height="22" fill="#648f88"/><text x="78" y="296" class="label">Nave: 2,80 M€</text><rect x="40" y="317" width="22" height="22" fill="#245765"/><text x="78" y="334" class="label">Maquinaria: 7,60 M€</text><rect x="40" y="355" width="22" height="22" fill="#b46b42"/><text x="78" y="372" class="label">Moldes: 0,60 M€</text><rect x="40" y="393" width="22" height="22" fill="#7d7398"/><text x="78" y="410" class="label">Informática: 0,20 M€</text><text x="445" y="285" class="label">La inversión no termina en los equipos.</text><text x="445" y="320" class="label">Hay que comprar materiales antes</text><text x="445" y="355" class="label">de empezar a vender y cobrar.</text><text x="445" y="413" class="label" font-weight="700">Necesidad inicial: 12,385 M€</text></svg>
