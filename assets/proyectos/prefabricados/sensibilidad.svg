<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">La rentabilidad depende de vender a buen precio</title><desc id="desc">El VAN base es positivo. Con una bajada del precio del diez por ciento pasa a ser negativo, al igual que con una caída del volumen del quince por ciento.</desc><rect width="1000" height="550" fill="#f7f7f1"/><style>text{font-family:Arial,sans-serif;fill:#243b38}.title{font-size:27px;font-weight:700}.label{font-size:19px}.small{font-size:16px}.grid{stroke:#d9dfd9;stroke-width:1}</style><text x="36" y="45" class="title">La rentabilidad depende de vender a buen precio</text><text x="36" y="82" class="label">VAN en millones de euros · una hipótesis cambia cada vez</text><line x1="360" y1="111" x2="360" y2="490" class="grid"/><text x="352" y="520" class="small">-3</text><line x1="445" y1="111" x2="445" y2="490" class="grid"/><text x="437" y="520" class="small">-2</text><line x1="530" y1="111" x2="530" y2="490" class="grid"/><text x="522" y="520" class="small">-1</text><line x1="615" y1="111" x2="615" y2="490" class="grid"/><text x="607" y="520" class="small">0</text><line x1="700" y1="111" x2="700" y2="490" class="grid"/><text x="692" y="520" class="small">1</text><line x1="785" y1="111" x2="785" y2="490" class="grid"/><text x="777" y="520" class="small">2</text><line x1="870" y1="111" x2="870" y2="490" class="grid"/><text x="862" y="520" class="small">3</text><line x1="955" y1="111" x2="955" y2="490" class="grid"/><text x="947" y="520" class="small">4</text><text x="36" y="138" class="label">Caso base</text><rect x="615" y="115" width="258.32488878188354" height="30" fill="#245765"/><text x="881.3248887818836" y="137" text-anchor="start" class="small">3,04</text><text x="36" y="184" class="label">Ventas −15 %</text><rect x="604.6945622476393" y="161" width="10.305437752360747" height="30" fill="#b46b42"/><text x="596.6945622476393" y="183" text-anchor="end" class="small">-0,12</text><text x="36" y="230" class="label">Precio −10 %</text><rect x="381.6084385251376" y="207" width="233.39156147486239" height="30" fill="#b46b42"/><text x="373.6084385251376" y="229" text-anchor="end" class="small">-2,75</text><text x="36" y="276" class="label">Coste variable +10 %</text><rect x="560.6953228813004" y="253" width="54.30467711869966" height="30" fill="#b46b42"/><text x="552.6953228813004" y="275" text-anchor="end" class="small">-0,64</text><text x="36" y="322" class="label">Inversión +15 %</text><rect x="615" y="299" width="117.8285916136242" height="30" fill="#245765"/><text x="740.8285916136242" y="321" text-anchor="start" class="small">1,39</text><text x="36" y="368" class="label">Cobro a 90 días</text><rect x="615" y="345" width="212.14798326698744" height="30" fill="#245765"/><text x="835.1479832669875" y="367" text-anchor="start" class="small">2,50</text><text x="36" y="414" class="label">Venta final −30 %</text><rect x="615" y="391" width="233.2549363867283" height="30" fill="#245765"/><text x="856.2549363867283" y="413" text-anchor="start" class="small">2,74</text><text x="36" y="460" class="label">Descuento al 12 %</text><rect x="615" y="437" width="124.71889691370843" height="30" fill="#245765"/><text x="747.7188969137085" y="459" text-anchor="start" class="small">1,47</text></svg>
